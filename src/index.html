<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Track Expense</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="alternate icon" type="image/png" href="assets/icons/icon-96x96.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b1120" id="theme-color-meta">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('expense-tracker.theme');
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>

<body class="bg-canvas flex justify-center min-h-screen selection:bg-accent/20 selection:text-primary overflow-x-hidden font-sans">
  <app-root
    class="block w-full max-w-4xl bg-canvas min-h-screen shadow-2xl relative border-x border-border-app"></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
