name: v2 app

on:
  push:
    branches: [master]
    paths: ['v2/app/**', '.github/workflows/v2-app.yml']
  pull_request:
    paths: ['v2/app/**', '.github/workflows/v2-app.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
