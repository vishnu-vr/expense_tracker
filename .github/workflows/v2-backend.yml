name: v2 backend

on:
  push:
    branches: [master]
    paths: ['v2/backend/**', '.github/workflows/v2-backend.yml']
  pull_request:
    paths: ['v2/backend/**', '.github/workflows/v2-backend.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/backend/functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
