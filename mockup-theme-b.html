<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme B · Midnight Bento — Light & Dark</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
  body{font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;background:#0b1120}
  .material-icons-round{font-family:'Material Icons Round'}
  .tabular-nums{font-variant-numeric:tabular-nums}
  .font-sora{font-family:'Sora',sans-serif}
  .phone{width:310px;height:660px;border-radius:42px;position:relative;overflow:hidden;box-shadow:0 22px 55px -12px rgba(0,0,0,.6),0 0 0 10px #1e293b,0 0 0 11px #334155;flex-shrink:0}
  .phone-screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
  .phone-screen::-webkit-scrollbar{width:0;display:none}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:118px;height:26px;border-bottom-left-radius:15px;border-bottom-right-radius:15px;z-index:60}
  .status-bar{position:sticky;top:0;z-index:55;display:flex;justify-content:space-between;align-items:center;padding:7px 22px 3px;font-size:10px;font-weight:700}
  .chip{font-size:9px;font-weight:700;padding:3px 9px;border-radius:999px}
  .bottom-bar{position:sticky;bottom:0;z-index:55;display:flex;align-items:center;justify-content:space-around;padding:9px 14px 13px}
  .fab{width:46px;height:46px;margin-top:-23px;border-radius:999px;display:flex;align-items:center;justify-content:center}
  .g-neon{background:linear-gradient(135deg,#22d3ee,#a855f7)}
  .g-neon-soft{background:linear-gradient(135deg,#0891b2,#7c3aed)}
</style>
</head>
<body class="text-slate-100 py-10 px-6">

<div class="max-w-5xl mx-auto mb-8">
  <div class="flex items-center gap-3 mb-1">
    <div class="w-11 h-11 rounded-2xl g-neon flex items-center justify-center shadow-lg"><span class="material-icons-round text-white">dark_mode</span></div>
    <div>
      <h1 class="text-2xl font-bold font-sora text-white">Theme B · Midnight Bento</h1>
      <p class="text-sm text-slate-400">Refined round — same design language rendered in both Dark and Light. This is how the light/dark toggle would look in-app.</p>
    </div>
  </div>
  <div class="flex flex-wrap gap-2 mt-4 items-center">
    <button onclick="setScreen('home')" id="s-home" class="chip px-4 py-2 rounded-xl bg-blue-600 text-white">Insights Home</button>
    <button onclick="setScreen('tx')" id="s-tx" class="chip px-4 py-2 rounded-xl bg-slate-800 text-slate-300">Transactions</button>
    <button onclick="setScreen('budget')" id="s-budget" class="chip px-4 py-2 rounded-xl bg-slate-800 text-slate-300">Budgets</button>
    <button onclick="setScreen('analysis')" id="s-analysis" class="chip px-4 py-2 rounded-xl bg-slate-800 text-slate-300">Analytics</button>
    <span class="ml-auto"></span>
    <button onclick="togglePrivacy()" id="privBtn" class="chip px-4 py-2 rounded-xl bg-slate-800 text-slate-300 flex items-center gap-1.5"><span class="material-icons-round text-[13px]">visibility</span> Privacy Off</button>
  </div>
</div>

<div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-y-10 gap-x-10 justify-items-center">
  <div>
    <div class="text-center mb-3 flex items-center justify-center gap-2"><span class="material-icons-round text-slate-300 text-[18px]">dark_mode</span><p class="font-sora font-bold text-white">Dark Mode</p></div>
    <div class="phone" style="background:#0b1120"><div class="notch" style="background:#000"></div><div class="phone-screen" id="dark"></div></div>
  </div>
  <div>
    <div class="text-center mb-3 flex items-center justify-center gap-2"><span class="material-icons-round text-slate-300 text-[18px]">light_mode</span><p class="font-sora font-bold text-white">Light Mode</p></div>
    <div class="phone" style="background:#f1f5f9"><div class="notch" style="background:#cbd5e1"></div><div class="phone-screen" id="light"></div></div>
  </div>
</div>

<div id="toast" class="fixed bottom-6 right-6 bg-slate-900 border border-slate-700 text-white text-xs px-4 py-3 rounded-xl shadow-2xl opacity-0 translate-y-3 transition-all pointer-events-none z-50 flex items-center gap-2"><span class="material-icons-round text-emerald-400 text-base">check_circle</span><span id="toastMsg"></span></div>

<script>
let privacy=false, screen='home';
function fmt(n,dec=0){if(privacy)return '••••';return '₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec});}
function toast(m){const t=document.getElementById('toast');document.getElementById('toastMsg').innerText=m;t.classList.remove('opacity-0','translate-y-3');setTimeout(()=>t.classList.add('opacity-0','translate-y-3'),1600);}
function togglePrivacy(){privacy=!privacy;const b=document.getElementById('privBtn');b.innerHTML=privacy?'<span class="material-icons-round text-[13px]">visibility_off</span> Privacy On':'<span class="material-icons-round text-[13px]">visibility</span> Privacy Off';b.classList.toggle('bg-blue-600',privacy);b.classList.toggle('text-white',privacy);b.classList.toggle('bg-slate-800',!privacy);b.classList.toggle('text-slate-300',!privacy);render();}
function setScreen(s){screen=s;['home','tx','budget','analysis'].forEach(k=>{const el=document.getElementById('s-'+k);const on=k===s;el.classList.toggle('bg-blue-600',on);el.classList.toggle('text-white',on);el.classList.toggle('bg-slate-800',!on);el.classList.toggle('text-slate-300',!on);});render();}

/* ---- Theme token sets: dark & light share the same neon identity ---- */
const T = {
  dark:{
    page:'#0b1120', notch:'#000', sbText:'#e2e8f0',
    card:'background:#161b2e;border:1px solid rgba(148,163,184,.12)',
    card2:'background:#1c2337;border:1px solid rgba(148,163,184,.10)',
    inset:'#0f172a',
    text:'#e2e8f0', sub:'#64748b', head:'#f1f5f9',
    heroGlow:true,
    navBg:'background:rgba(11,17,32,.92);backdrop-filter:blur(14px);border-top:1px solid rgba(148,163,184,.12)',
    navOn:'text-cyan-400', navOff:'text-slate-600',
    pill:'background:#161b2e;color:#94a3b8',
    tabInset:'#0d1120'
  },
  light:{
    page:'#f1f5f9', notch:'#cbd5e1', sbText:'#0f172a',
    card:'background:#ffffff;border:1px solid #e2e8f0',
    card2:'background:#ffffff;border:1px solid #eef2f7',
    inset:'#e2e8f0',
    text:'#1e293b', sub:'#94a3b8', head:'#0f172a',
    heroGlow:false,
    navBg:'background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-top:1px solid #e2e8f0',
    navOn:'text-cyan-600', navOff:'text-slate-400',
    pill:'background:#f1f5f9;color:#64748b',
    tabInset:'#ffffff'
  }
};
const accent = '#22d3ee', accentInk = m=> m==='dark' ? '#22d3ee' : '#0891b2';

function statusBar(c){return `<div class="status-bar" style="color:${c}"><span>9:41</span><span class="flex gap-1"><span class="material-icons-round text-[11px]">signal_cellular_alt</span><span class="material-icons-round text-[11px]">wifi</span><span class="material-icons-round text-[11px]">battery_full</span></span></div>`;}
function nav(m){const t=T[m];return `<div class="bottom-bar" style="${t.navBg}">
  ${ni('insights','Home',true,t.navOn,t.navOff)}${ni('receipt_long','Activity',false,t.navOn,t.navOff)}
  <div onclick="toast('Add transaction')" class="fab g-neon text-white shadow-lg"><span class="material-icons-round text-[22px]">add</span></div>
  ${ni('account_balance_wallet','Budgets',false,t.navOn,t.navOff)}${ni('pie_chart','Stats',false,t.navOn,t.navOff)}</div>`;}
function ni(icon,label,on,onC,offC){return `<div class="flex flex-col items-center gap-0.5 ${on?onC:offC}"><span class="material-icons-round text-[20px]">${icon}</span><span class="text-[8px] font-semibold">${label}</span></div>`;}

/* ---------- HOME ---------- */
function home(m){const t=T[m];const ink=accentInk(m);return `${statusBar(t.sbText)}
<div class="px-4 pb-24 pt-1 space-y-3" style="color:${t.text}">
  <div class="flex justify-between items-center">
    <div><p class="text-[15px] font-bold font-sora" style="color:${t.head}">Hi, Vishnu</p><p class="text-[10px]" style="color:${t.sub}">Bangalore Home</p></div>
    <div class="flex gap-1.5">
      <div class="w-8 h-8 rounded-full flex items-center justify-center" style="${t.card}"><span class="material-icons-round text-[16px]" style="color:${t.sub}">notifications</span></div>
      <div class="w-8 h-8 rounded-full g-neon flex items-center justify-center text-white text-xs font-bold">V</div>
    </div>
  </div>

  <div class="rounded-3xl p-4 relative overflow-hidden" style="${t.card}">
    ${t.heroGlow?'<div class="absolute -right-6 -top-6 w-24 h-24 rounded-full g-neon opacity-20 blur-2xl"></div>':''}
    <p class="text-[10px] font-semibold uppercase tracking-wide" style="color:${t.sub}">Net Cash Flow · Aug</p>
    <p class="text-3xl font-bold tabular-nums mt-1 font-sora" style="color:${ink}">${fmt(-45054.88,2)}</p>
    <p class="text-[10px] mt-1 text-emerald-500 flex items-center gap-1"><span class="material-icons-round text-[12px]">trending_up</span> +14.2% vs last month</p>
    <div class="flex justify-between mt-3 pt-3 text-[11px]" style="border-top:1px solid ${m==='dark'?'rgba(255,255,255,.1)':'#eef2f7'}">
      <div><p style="color:${t.sub}">Income</p><p class="font-bold tabular-nums text-emerald-500">${fmt(280189)}</p></div>
      <div class="text-right"><p style="color:${t.sub}">Expense</p><p class="font-bold tabular-nums text-rose-500">${fmt(325244)}</p></div>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-2.5">
    <div class="rounded-2xl p-3" style="${t.card2}">
      <div class="flex items-center gap-1 mb-1" style="color:#818cf8"><span class="material-icons-round text-[15px]">speed</span><span class="text-[10px] font-bold uppercase">Burn</span></div>
      <p class="text-base font-bold tabular-nums font-sora" style="color:${t.head}">${fmt(11616)}<span class="text-[9px]" style="color:${t.sub}">/day</span></p>
      <p class="text-[9px] mt-1" style="color:${t.sub}">Forecast ${fmt(360091)}</p>
    </div>
    <div class="rounded-2xl p-3" style="${t.card2}">
      <div class="flex items-center gap-1 mb-1" style="color:#f59e0b"><span class="material-icons-round text-[15px]">donut_large</span><span class="text-[10px] font-bold uppercase">Pacing</span></div>
      <p class="text-base font-bold tabular-nums font-sora" style="color:#f59e0b">119%</p>
      <div class="h-1.5 rounded-full mt-1.5 overflow-hidden" style="background:${t.inset}"><div class="h-full" style="width:100%;background:linear-gradient(90deg,#f59e0b,#ef4444)"></div></div>
    </div>
  </div>

  <p class="text-[10px] font-bold uppercase tracking-wide pt-1" style="color:${t.sub}">Smart Insights</p>
  <div class="rounded-2xl p-3 flex items-start gap-2.5" style="${t.card2}">
    <div class="w-7 h-7 rounded-xl flex items-center justify-center shrink-0" style="background:rgba(245,158,11,.15);color:#f59e0b"><span class="material-icons-round text-[15px]">auto_awesome</span></div>
    <div><p class="text-[9px] font-bold uppercase" style="color:${t.sub}">Peak Spike</p><p class="text-[11px] leading-snug">Entertainment surged to 54% of total spend.</p></div>
  </div>
  <div class="rounded-2xl p-3 flex items-start gap-2.5" style="${t.card2}">
    <div class="w-7 h-7 rounded-xl flex items-center justify-center shrink-0" style="background:rgba(168,85,247,.15);color:#a855f7"><span class="material-icons-round text-[15px]">weekend</span></div>
    <div><p class="text-[9px] font-bold uppercase" style="color:${t.sub}">Weekend Habit</p><p class="text-[11px] leading-snug">68% of food spend happens Fri–Sun.</p></div>
  </div>

  <div onclick="toast('Ask AI opened')" class="rounded-2xl p-3 flex items-center justify-between" style="background:linear-gradient(135deg,rgba(34,211,238,.14),rgba(168,85,247,.14));border:1px solid rgba(168,85,247,.3)">
    <div class="flex items-center gap-2"><span class="material-icons-round text-[18px]" style="color:${ink}">psychology</span><div><p class="text-[11px] font-bold">Ask AI Advisor</p><p class="text-[9px]" style="color:${t.sub}">"Where can I save ₹10k?"</p></div></div>
    <span class="material-icons-round text-[15px]" style="color:${t.sub}">chevron_right</span>
  </div>

  <div class="flex justify-between items-center pt-1"><p class="text-[11px] font-bold">Recent</p><span class="text-[10px] font-semibold" style="color:${ink}">View all</span></div>
  ${txrow(m,'card_giftcard','Gifts','2:12 AM','+'+fmt(9000),'#10b981')}
  ${txrow(m,'restaurant','Food','Lunch','-'+fmt(364),'#f43f5e')}
</div>${nav(m)}`;}
function txrow(m,icon,name,sub,amt,ac){const t=T[m];return `<div class="rounded-2xl p-2.5 flex items-center justify-between" style="${t.card2}">
  <div class="flex items-center gap-2"><div class="w-7 h-7 rounded-full flex items-center justify-center" style="${t.pill}"><span class="material-icons-round text-[14px]">${icon}</span></div><div><p class="text-[11px] font-semibold">${name}</p><p class="text-[9px]" style="color:${t.sub}">${sub}</p></div></div>
  <span class="text-[11px] font-bold tabular-nums" style="color:${ac}">${amt}</span></div>`;}

/* ---------- TRANSACTIONS ---------- */
function tx(m){const t=T[m];const ink=accentInk(m);return `${statusBar(t.sbText)}
<div class="px-4 pb-24 pt-1 space-y-3" style="color:${t.text}">
  <p class="text-[15px] font-bold font-sora" style="color:${t.head}">Transactions</p>
  <div class="flex p-0.5 rounded-xl text-[10px] font-semibold" style="${t.card}"><div class="flex-1 py-1.5 text-center" style="color:${t.sub}">Daily</div><div class="flex-1 py-1.5 text-center rounded-lg" style="background:${t.tabInset};color:${ink}">Monthly</div></div>
  <div class="rounded-2xl px-3 py-2 flex justify-between items-center text-[11px] font-bold" style="${t.card}"><span class="material-icons-round text-[14px]">chevron_left</span><span>August 2026</span><span class="material-icons-round text-[14px]">chevron_right</span></div>
  <div class="rounded-2xl p-2.5" style="${t.card2};border-left:3px solid ${ink}"><p class="text-[11px] font-bold">Budget heads-up</p><p class="text-[9px]" style="color:${t.sub}">2 categories over budget</p></div>
  <p class="text-[10px] font-semibold flex justify-between" style="color:${t.sub}"><span>Aug 28, Fri</span><span class="tabular-nums" style="color:${t.text}">+${fmt(9000)}</span></p>
  ${txrow(m,'card_giftcard','Gifts','2:12 AM · Gift','+'+fmt(9000),'#10b981')}
  <p class="text-[10px] font-semibold flex justify-between pt-1" style="color:${t.sub}"><span>Aug 27, Thu</span><span class="tabular-nums" style="color:${t.text}">-${fmt(682)}</span></p>
  ${txrow(m,'restaurant','Food','2:06 PM · Lunch','-'+fmt(364),'#f43f5e')}
  ${txrow(m,'home','Home','10:24 AM · Security','-'+fmt(50),'#f43f5e')}
  ${txrow(m,'directions_bus','Transport','2:14 AM · Uber','-'+fmt(198),'#f43f5e')}
</div>${nav(m)}`;}

/* ---------- BUDGETS ---------- */
function budget(m){const t=T[m];const ink=accentInk(m);return `${statusBar(t.sbText)}
<div class="px-4 pb-24 pt-1 space-y-3" style="color:${t.text}">
  <div class="flex justify-between items-center"><p class="text-[15px] font-bold font-sora" style="color:${t.head}">Budgets</p><span class="chip flex items-center gap-1" style="background:rgba(52,211,153,.15);color:#10b981"><span class="material-icons-round text-[12px]">add</span>Add</span></div>
  <div class="rounded-2xl px-3 py-2 flex justify-between items-center text-[11px] font-bold" style="${t.card}"><span class="material-icons-round text-[14px]">chevron_left</span><span>August 2026</span><span class="material-icons-round text-[14px]">chevron_right</span></div>
  ${budrow(m,'volunteer_activism','Donation',2450,1500,163,'#ef4444')}
  ${budrow(m,'card_giftcard','Gift',47572,40000,119,'#ef4444')}
  ${budrow(m,'restaurant','Food',13363,15000,89,'#f59e0b')}
  ${budrow(m,'shopping_cart','Grocery',10186,12000,85,'#10b981')}
</div>${nav(m)}`;}
function budrow(m,icon,name,spent,cap,pct,color){const t=T[m];return `<div class="rounded-2xl p-3 space-y-1.5" style="${t.card2}">
  <div class="flex justify-between items-center"><div class="flex items-center gap-2"><div class="w-7 h-7 rounded-full flex items-center justify-center text-white" style="background:${color}"><span class="material-icons-round text-[14px]">${icon}</span></div><div><p class="text-[11px] font-bold">${name}</p><p class="text-[9px]" style="color:${t.sub}">${fmt(spent)} · <span style="color:${color}" class="font-bold">${pct}%</span></p></div></div><span class="material-icons-round text-[15px]" style="color:${t.sub}">delete_outline</span></div>
  <div class="h-1.5 rounded-full overflow-hidden" style="background:${t.inset}"><div class="h-full" style="width:${Math.min(100,pct)}%;background:${color}"></div></div>
  <p class="text-[9px] text-right" style="color:${t.sub}">Cap ${fmt(cap)}</p></div>`;}

/* ---------- ANALYTICS ---------- */
function analysis(m){const t=T[m];const ink=accentInk(m);
  const cats=[['Entertainment','54.1%',176055,'#a855f7'],['Gift','14.6%',47572,'#84cc16'],['Home','10.6%',34509,'#a16207'],['Transport','6.1%',19950,'#3b82f6'],['Food','4.1%',13363,'#f97316'],['Grocery','3.1%',10186,'#14b8a6']];
  // donut via conic-gradient
  const conic=`background:conic-gradient(#a855f7 0 54.1%,#84cc16 54.1% 68.7%,#a16207 68.7% 79.3%,#3b82f6 79.3% 85.4%,#f97316 85.4% 89.5%,#14b8a6 89.5% 100%)`;
  return `${statusBar(t.sbText)}
<div class="px-4 pb-24 pt-1 space-y-3" style="color:${t.text}">
  <p class="text-[15px] font-bold font-sora" style="color:${t.head}">Analysis</p>
  <div class="text-center py-1"><p class="text-[9px] uppercase tracking-widest" style="color:${t.sub}">Total Expense · Aug</p><p class="text-2xl font-bold tabular-nums font-sora" style="color:${t.head}">${fmt(325243.88,2)}</p></div>
  <div class="rounded-2xl p-4 flex flex-col items-center" style="${t.card}">
    <div class="relative w-36 h-36">
      <div class="w-full h-full rounded-full" style="${conic}"></div>
      <div class="absolute inset-0 m-auto rounded-full flex flex-col items-center justify-center" style="width:82px;height:82px;background:${m==='dark'?'#161b2e':'#ffffff'}">
        <span class="text-[8px]" style="color:${t.sub}">Total</span><span class="text-[10px] font-bold tabular-nums">${fmt(325244)}</span>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-x-4 gap-y-1.5 w-full mt-3 text-[10px]">
      ${cats.map(c=>`<div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background:${c[3]}"></span><span style="color:${t.sub}" class="truncate">${c[0]}</span><span class="ml-auto font-bold">${c[1]}</span></div>`).join('')}
    </div>
  </div>
  <div onclick="toast('Trends opened')" class="rounded-2xl p-3 flex items-center justify-between" style="background:linear-gradient(135deg,rgba(34,211,238,.14),rgba(168,85,247,.14));border:1px solid rgba(168,85,247,.3)">
    <div class="flex items-center gap-2"><span class="material-icons-round text-[18px]" style="color:${ink}">trending_up</span><div><p class="text-[11px] font-bold">6-Month Trends</p><p class="text-[9px]" style="color:${t.sub}">Cadence & rising categories</p></div></div>
    <span class="material-icons-round text-[15px]" style="color:${t.sub}">chevron_right</span>
  </div>
  <p class="text-[10px] font-bold uppercase tracking-wide pt-1" style="color:${t.sub}">Top Categories</p>
  ${cats.slice(0,3).map(c=>`<div class="rounded-2xl p-3 space-y-1.5" style="${t.card2}">
    <div class="flex justify-between items-center text-[11px]"><div class="flex items-center gap-2"><span class="w-6 h-6 rounded-full flex items-center justify-center text-white" style="background:${c[3]}"><span class="material-icons-round text-[12px]">label</span></span><span class="font-semibold">${c[0]}</span></div><span class="font-bold tabular-nums">${fmt(c[2])} <span style="color:${t.sub}" class="font-normal">(${c[1]})</span></span></div>
    <div class="h-1.5 rounded-full overflow-hidden" style="background:${t.inset}"><div class="h-full" style="width:${c[1]};background:${c[3]}"></div></div>
  </div>`).join('')}
</div>${nav(m)}`;}

const R={home,tx,budget,analysis};
function render(){['dark','light'].forEach(m=>{document.getElementById(m).innerHTML=R[screen](m);});}
render();
</script>
</body>
</html>
