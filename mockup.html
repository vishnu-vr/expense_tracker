        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 1.25rem;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
        }
        .gradient-positive {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        .gradient-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        .gradient-ai {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
        }
        .gradient-trends {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
        }
        /* Mobile Device Frame */
        .phone-frame {
            width: 390px;
            height: 844px;
            border-radius: 48px;
            box-shadow: 0 25px 60px -15px rgba(0,0,0,0.3), 0 0 0 12px #1e293b, 0 0 0 14px #334155;
            position: relative;
            overflow: hidden;
            background: #f8fafc;
        }
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 30px;
            background: #1e293b;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            z-index: 50;
        }
        /* Custom Scrollbar */
        .screen-content::-webkit-scrollbar {
            width: 4px;
        }
        .screen-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        /* Pacing animations */
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 3s ease-in-out infinite;

            if (isPrivacyActive) return '••••';

        }

        function formatINRFull(amount) {
            if (isPrivacyActive) return '••••';
            return '₹' + Number(amount).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        function togglePrivacy() {
            isPrivacyActive = !isPrivacyActive;
            const icon = document.getElementById('privacyIcon');
            const text = document.getElementById('privacyText');
            if (isPrivacyActive) {
                icon.innerText = 'visibility_off';
                text.innerText = 'Privacy: On';
                showToast('Privacy Mode Enabled: Amounts masked');
            } else {
                icon.innerText = 'visibility';
                text.innerText = 'Privacy: Off';
                showToast('Privacy Mode Disabled: Amounts visible');
            }
            renderScreens();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-3');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-3');
            }, 2200);
        }

        // ==========================================
        // SCREEN SWITCHER & RENDERING
        // ==========================================
        function switchScreen(screen) {
            currentActiveScreen = screen;
            const phoneView = document.getElementById('phoneView');
            const gridView = document.getElementById('gridView');

            // Reset tab styles in header
            ['home', 'transactions', 'budgets', 'analysis', 'grid'].forEach(t => {
                const tabEl = document.getElementById('tab-' + t);
                if (tabEl) {
                    if (t === screen) {
                        tabEl.className = 'px-3 py-1.5 rounded-lg text-white bg-blue-600 shadow-sm transition-all flex items-center gap-1.5 font-semibold';
                    } else {
                        tabEl.className = 'px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all flex items-center gap-1.5 font-medium';
                    }
                }
            });

            // Reset bottom nav active icons
            ['home', 'transactions', 'budgets', 'analysis'].forEach(t => {
                const bnavEl = document.getElementById('bnav-' + t);
                if (bnavEl) {
                    if (t === screen) {
                        bnavEl.className = 'flex flex-col items-center gap-0.5 text-blue-600 font-bold transition-colors';
                    } else {
                        bnavEl.className = 'flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-600 transition-colors';
                    }
                }
            });

            if (screen === 'grid') {
                phoneView.classList.add('hidden');
                gridView.classList.remove('hidden');
            } else {
                gridView.classList.add('hidden');
                phoneView.classList.remove('hidden');
            }

            renderScreens();
        }

        function renderScreens() {
            const viewport = document.getElementById('screenViewport');
            if (currentActiveScreen === 'home') {
                viewport.innerHTML = getHomeScreenHTML();
            } else if (currentActiveScreen === 'transactions') {
                viewport.innerHTML = getTransactionsScreenHTML();
            } else if (currentActiveScreen === 'budgets') {
                viewport.innerHTML = getBudgetsScreenHTML();
            } else if (currentActiveScreen === 'analysis') {
                viewport.innerHTML = getAnalysisScreenHTML();
            }

            // Also render for grid view
            document.getElementById('gridScreen1').innerHTML = getHomeScreenHTML();
            document.getElementById('gridScreen2').innerHTML = getTransactionsScreenHTML();
            document.getElementById('gridScreen3').innerHTML = getBudgetsScreenHTML();
            document.getElementById('gridScreen4').innerHTML = getAnalysisScreenHTML();
        }

        // Initialize on load
        renderScreens();
